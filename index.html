<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landwind</title>
    <!-- CSS LINKS  -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Story+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen font-inter">
    <header>
      <div id="container" class="flex justify-between items-center my-6 mx-16">
        <div id="navbar_&_logo" class="flex gap-4">
          <div id="logo-image">
            <img src="images/logo.svg" alt="Landwind" />
          </div>
          <div id="navbar" class="flex gap-4 items-center">
            <a href="#">Company</a>
            <a href="#">Marketplace</a>
            <a href="#">Features</a>
            <a href="#">Team</a>
            <a href="#">Contact</a>
          </div>
        </div>
        <div id="login_signup" class="space-x-4">
          <a id="login" href="#">Log in</a>
          <a
            id="get_started"
            href="#"
            class="bg-[#7E3AF2] text-white p-2 rounded-lg"
            >Get started</a
          >
        </div>
      </div>
    </header>
    <section id="hero"></section>
    <section id="partner"></section>
    <section id="tools"></section>
    <section id="about"></section>
    <section id="comment"></section>
    <section id="subscription"></section>
    <section id="trial"></section>
    <footer></footer>
  </body>
</html>
